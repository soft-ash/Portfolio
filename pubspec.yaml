name: my_portfolio
description: "Premium personal portfolio — Flutter Developer & Software Engineer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  visibility_detector: ^0.4.0+2
  flutter_svg: ^2.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/resume/
